# ------------------------------------------------------------------
# nginx reverse proxy — BASELINE (bilerek sertleştirilmemiş) yapılandırma
#
# Faz 6'da (Remediation) eklenecekler, şimdilik YOK:
#   - güvenlik başlıkları (CSP, X-Frame-Options, HSTS, X-Content-Type-Options...)
#   - server_tokens off (sürüm bilgisini gizleme)
#   - rate limiting (brute force'a karşı)
#   - TLS
# Böylece düzeltme öncesi / sonrası farkı ölçülebilir.
# ------------------------------------------------------------------

upstream juice_shop {
    server juice-shop:3000;
}

server {
    listen 80;
    server_name _;

    # Standart "combined" formatı: Wazuh'un hazır web-accesslog decoder'ları tanır.
    # server{} içinde olmalı: imajın nginx.conf'u http{} seviyesinde zaten
    # "access_log ... main" tanımlıyor; aynı seviyede yazılırsa her istek
    # İKİ KEZ loglanır. Alt bloktaki tanım üst bloktakini geçersiz kılar.
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass         http://juice_shop;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Juice Shop WebSocket (socket.io) kullanıyor
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
