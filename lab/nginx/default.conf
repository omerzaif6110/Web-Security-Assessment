# ------------------------------------------------------------------
# nginx reverse proxy — SERTLEŞTİRİLMİŞ yapılandırma (Faz 6, Remediation)
#
# Faz 3 bulgularına karşı nginx katmanı düzeltmeleri. Her değişiklik
# ilgili bulgu ID'si ile işaretli. Önce/sonra kanıtı: Remediation/.
#
# Kök nedeni UYGULAMA KODUNDA olan bulgular (F-01/F-02 SQLi, F-03 yetkisiz
# erişim) burada düzeltilmez; Remediation/README.md'de kod önerisi olarak
# belgelenir. Aşağıdakiler reverse proxy'nin doğru biçimde çözebildikleri.
# ------------------------------------------------------------------

# F-07 / R-07: nginx sürümünü yanıtlardan gizle (Server: nginx)
server_tokens off;

upstream juice_shop {
    server juice-shop:3000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # --- F-07: eksik güvenlik başlıkları ---
    # Uygulama X-Frame-Options ve X-Content-Type-Options'ı zaten gönderiyor;
    # burada TEKRAR eklemiyoruz (yoksa çift başlık olur). Yalnızca eksikleri ekliyoruz.
    # CSP: Angular SPA inline script/style ve eval kullandığı için 'unsafe-inline'/
    # 'unsafe-eval' gerekiyor (bu, CSP'yi zayıflatır — raporda belirtildi). Yine de
    # default-src kısıtlaması ve frame-ancestors (clickjacking) değer katıyor.
    # Not: style-src/font-src'e Google Fonts eklendi — uygulamanın gerçekten kullandığı
    # kaynaklar (tarayıcı konsolunda CSP ihlaliyle tespit edildi). İyi CSP, meşru
    # kaynaklara izin verip gerisini kısıtlar; "her şeyi engelle" uygulamayı bozardı.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # --- F-06: gevşek CORS ---
    # Uygulama "Access-Control-Allow-Origin: *" gönderiyor. Uygulama aynı kaynaktan
    # sunulduğu için CORS'a ihtiyacı yok; başlığı upstream yanıtından kaldırıyoruz.
    proxy_hide_header Access-Control-Allow-Origin;

    # --- F-04: /ftp hassas dosya ifşası ---
    # Dizin ve altındaki dosyalara (kdbx parola DB, yedekler) erişimi engelle.
    location ^~ /ftp {
        return 403;
    }

    location / {
        # --- F-05: açık yönlendirme atlatma (savunma derinliği) ---
        # Gerçek düzeltme uygulamada (tam-eşleşen izin listesi). nginx'te atlatma
        # imzasını (to parametresinde birden fazla şema) engelliyoruz.
        if ($arg_to ~* "://.*://") { return 403; }
        if ($arg_to ~* "%3a%2f%2f.*%3a%2f%2f") { return 403; }

        proxy_pass         http://juice_shop;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
